# Panel shared run-state — copy to panel-report/run-state.yaml at Phase 0
# Every specialist reads this; Orchestrator updates it each phase.
# Handoffs should reference fields/artifacts here — do not re-narrate the whole run.

preflight: GO # GO | NO-GO | lite
protocol: short # short = PANEL.md only · full = + PANEL.full.md + COLLABORATION + AGENTS
run_class: standard # lite | standard | full | implement

intent: ""
preserve:
  - "npx @tysongreenan/panel init"
  # brand, libraries, sample report path, …

personas_seated:
  - Avery
  - Jordan
  - Sam

priority: Avery # persona name this run
secondary:
  - persona: Jordan
    non_negotiables:
      - Real init / OSS credibility
  - persona: Sam
    non_negotiables:
      - Sample looks serious, not a toy
deferred: []

design_brief:
  # Required before library search / redesign when run_class is full (or UI-heavy standard)
  # standard defaults to Orchestrator + priority PM; add secondary PMs only if their non-negotiable is touched
  Orchestrator: ""
  PM-Avery: ""
  PM-Jordan: ""
  PM-Sam: ""

missing_jobs: [] # e.g. proof, trust, orientation, comparison, next-step clarity

calibration:
  path: docs/design-calibration.md
  status: null # loaded | missing-drafted | missing-blocked | n/a
  positive_refs: [] # { ref: "...", traits: ["..."] }
  anti_refs: [] # { ref: "...", avoid: ["..."] }

# Visual system contract — Design System Checker owns (DESIGN-SYSTEM.md + skills/design-md/)
design_system:
  path: web/DESIGN.md # client path | missing-drafted | n/a
  status: null # loaded | missing-drafted | missing-blocked | n/a
  constraints: [] # 3–5 bullets extracted from DESIGN.md after full load
  alignment: null # pass | drift | fail — Design System Checker only
  doc_quality: null # professional | thin | rewrite — Design System Checker only
  sections_cited: [] # e.g. Colors, Components, Do’s and Don’ts
  audit_path: null # e.g. panel-report/design-system.md

scores:
  clarity: null
  density: null
  hierarchy: null
  craft: null
  motion: null
  fluidity: null
  professionalism: null
  conversion: null

# Approves: role → { status: yes|no|abstain, evidence: "one line from that role's section" }
approves: {}

# Decision gates
consensus:
  decision: null # PROCEED | REVISE | BLOCK | null
  log_path: null # e.g. panel-report/council.md#consensus-…
  revise_round: 0 # max 2 before BLOCK or ask user

hypotheses:
  status: null # drafted | cross-critiqued | approved | measured | n/a
  artifact: panel-report/hypotheses.md
  active_ids: [] # e.g. [H-001, H-002]
  unresolved_ids: []

learning:
  status: null # open | routed | closed
  artifact: panel-report/learning.md
  confirmed_ids: []
  disproved_ids: []
  inconclusive_ids: []
  untested_ids: [] # review-only proposals; must retain owner + trigger + test to carry forward
  system_updates: [] # { hypothesis: H-001, owner: "...", path: "...", status: updated|deferred }
  next_run_tests: []

delivery_status: null # PLANNED | IMPLEMENTED | REVISE | BLOCKED | SHIPPABLE

verification:
  verdict: null # PASS | REVISE | BLOCK | n/a
  blocker: null # exact runtime/browser blocker; null when available
  artifact: panel-report/verification.md
  before_evidence: [] # baseline screenshots or approved proposal references
  desktop_evidence: []
  mobile_evidence: []
  visual_regression: null # pass | fail | n/a
  preserve_regression: null # pass | fail | n/a
  states:
    default: null # pass | fail | "n/a: reason"
    hover: null
    focus_visible: null
    focus_not_obscured: null # WCAG 2.4.11: pass | fail | n/a: no focusable component
    active_pressed: null
    loading: null
    empty: null
    error: null
    disabled: null
    success: null
    reduced_motion: null

design_system_delta:
  status: null # updated | none | required-blocked
  sections: []
  rationale: ""

artifacts:
  # Paths relative to project root — prefer refs over pasted walls of text
  council: panel-report/council.md
  product: panel-report/product.md
  empathy: panel-report/empathy.md
  journeys: panel-report/journeys.md
  heuristics: panel-report/heuristics.md
  design_system: panel-report/design-system.md
  craft: panel-report/craft.md
  prose: panel-report/prose.md
  copy: panel-report/copy.md
  motion: panel-report/motion.md
  frontend: panel-report/frontend.md
  report: panel-report/report.md
  verification: panel-report/verification.md
  process_score: panel-report/process-score.md
  hypotheses: panel-report/hypotheses.md
  learning: panel-report/learning.md
  findings: panel-report/findings.json

notes: ""

skills_used:
  # For every in-scope specialist seat on standard/full runs
  # - seat: Craft Critic
  #   files:
  #     - ANTI-SLOP.md
  #   hook: "Used anti-reference check against identical card-grid DNA"
  #   artifact: panel-report/craft.md

artifact_checks:
  # - seat: Craft Critic
  #   required: panel-report/craft.md
  #   present: false
