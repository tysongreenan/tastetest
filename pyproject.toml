[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tastetest"
version = "0.1.0"
description = "The UX review that lives in your repo — buyer-level EmpathFlow audits"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Tyson Greenan" }]
keywords = ["ux", "ui", "empathy", "playwright", "design-review", "tastetest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
tastetest = "empathflow.cli:main"

[project.urls]
Homepage = "https://github.com/tysongreenan/tastetest"
Repository = "https://github.com/tysongreenan/tastetest"

[tool.setuptools.packages.find]
include = ["empathflow*"]
