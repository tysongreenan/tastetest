[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panel"
version = "0.1.0"
description = "A buyer panel that lives in your repo — persona review and scored UX report"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Tyson Greenan" }]
keywords = ["ux", "ui", "buyer-panel", "persona", "playwright", "design-review"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
panel = "panelcore.cli:main"

[project.urls]
Homepage = "https://github.com/tysongreenan/tastetest"
Repository = "https://github.com/tysongreenan/tastetest"

[tool.setuptools.packages.find]
include = ["panelcore*"]
